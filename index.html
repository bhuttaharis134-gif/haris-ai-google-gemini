<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haris AI</title>
<style>
:root{color-scheme:dark;--bg:#212121;--side:#171717;--panel:#2f2f2f;--text:#f4f4f4;--muted:#aaa;--line:#3b3b3b;--accent:#10a37f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Arial,sans-serif}button,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{display:flex;min-height:100vh}.sidebar{width:255px;background:var(--side);padding:14px 10px;display:flex;flex-direction:column;gap:9px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;padding:8px 9px 16px;font-size:19px;font-weight:bold}.logo{display:grid;place-items:center;width:30px;height:30px;background:var(--accent);border-radius:9px}.sidebtn{background:transparent;border:0;border-radius:9px;padding:11px;text-align:left;width:100%}.sidebtn:hover{background:#2b2b2b}.history{overflow:auto;flex:1}.history button{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile{border-top:1px solid var(--line);padding:12px 6px;display:flex;gap:10px;align-items:center}.avatar{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:#555}.muted{color:var(--muted);font-size:12px}.upgrade{margin-left:auto;border:1px solid #555;border-radius:20px;background:transparent;padding:6px 9px;font-size:12px}.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.model{border:1px solid var(--line);border-radius:20px;padding:8px 12px;background:transparent}.topbar a{color:#8fcdbb;text-decoration:none}.content{flex:1;display:flex;flex-direction:column;align-items:center;padding:35px 18px 18px}.welcome{margin:auto 0 25px;text-align:center}.welcome h1{font-size:29px;letter-spacing:-.6px;margin:0 0 7px}.welcome p{color:var(--muted);margin:0}.chat{width:min(790px,100%);margin:0 auto 24px;display:flex;flex-direction:column;gap:23px}.msg{display:flex;gap:12px;align-items:flex-start}.msg.user{justify-content:flex-end}.bubble{max-width:87%;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#303030;padding:12px 16px;border-radius:20px}.assistant .bubble{padding:3px 0}.msg .avatar{flex-shrink:0;width:30px;height:30px;font-size:12px}.composer-wrap{width:min(790px,100%);margin-top:auto}.composer{background:var(--panel);border:1px solid #414141;border-radius:25px;padding:12px 13px 9px}.composer textarea{width:100%;border:0;outline:0;resize:none;min-height:35px;max-height:180px;background:transparent;color:var(--text);padding:5px 8px}.composer-bottom{display:flex;justify-content:space-between;align-items:center}.tool{background:transparent;border:0;color:#ccc;padding:7px 9px}.send{border:0;border-radius:50%;width:35px;height:35px;background:#fff;color:#111;font-size:20px;font-weight:bold}.send:disabled{opacity:.5}.notice{text-align:center;color:#888;font-size:11px;margin:11px 0}.hidden{display:none!important}.toast{width:min(790px,100%);color:#ffb4a9;font-size:13px;margin:0 auto 10px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}.suggestion{background:transparent;border:1px solid #484848;border-radius:14px;padding:13px;text-align:left;color:#ddd}.suggestion:hover{background:#2b2b2b}
@media(max-width:740px){.sidebar{position:fixed;z-index:5;left:-270px;top:0;bottom:0;transition:left .2s}.sidebar.open{left:0}.menu{display:inline-block!important}.topbar{padding:0 12px}.content{padding:28px 12px 14px}.welcome h1{font-size:24px}.suggestions{grid-template-columns:1fr}}
.menu{display:none;background:transparent;border:0;margin-right:8px}
</style></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><span class="logo">H</span> Haris AI</div>
<button class="sidebtn" id="new">＋ &nbsp; New chat</button><div class="muted" style="padding:15px 10px 4px">Recent chats</div><div class="history" id="history"></div>
<button class="sidebtn" id="clear">♲ &nbsp; Clear history</button><div class="profile"><div class="avatar">H</div><div><b>Haris</b><div class="muted">AI Assistant</div></div><button class="upgrade" id="upgrade">Upgrade</button></div></aside>
<main class="main"><header class="topbar"><div><button class="menu" id="menu">☰</button><button class="model">Haris AI <span class="muted">⌄</span></button></div><a href="#" id="upgradeTop">✦ Upgrade</a></header>
<section class="content"><div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Ask me a question to get started.</p></div><div class="chat hidden" id="chat"></div>
<div class="composer-wrap"><div class="toast hidden" id="error"></div><div class="suggestions" id="suggestions"><button class="suggestion" data-q="Help me create a WordPress website">▧ &nbsp; Build a WordPress website</button><button class="suggestion" data-q="Explain artificial intelligence in simple words">✧ &nbsp; Explain something</button><button class="suggestion" data-q="Write a professional email">✎ &nbsp; Write something</button><button class="suggestion" data-q="Give me creative project ideas">☼ &nbsp; Brainstorm ideas</button></div>
<div class="composer"><textarea id="prompt" rows="1" placeholder="Message Haris AI"></textarea><div class="composer-bottom"><button class="tool" id="clearInput">＋</button><button class="send" id="send" aria-label="Send">↑</button></div></div><p class="notice">Haris AI uses Google Gemini. Avoid sharing passwords or private information.</p></div></section></main></div>
<script>
const $=s=>document.querySelector(s);let chats=JSON.parse(localStorage.getItem('haris_ai_chats')||'[]'),currentId=null,busy=false;
function persist(){localStorage.setItem('haris_ai_chats',JSON.stringify(chats));renderHistory()}
function active(){return chats.find(c=>c.id===currentId)}
function renderHistory(){const h=$('#history');h.innerHTML='';[...chats].reverse().forEach(c=>{const b=document.createElement('button');b.className='sidebtn';b.textContent='▤ '+c.title;b.onclick=()=>load(c.id);h.appendChild(b)})}
function fresh(){currentId=null;$('#chat').innerHTML='';$('#chat').classList.add('hidden');$('#welcome').classList.remove('hidden');$('#suggestions').classList.remove('hidden');$('#error').classList.add('hidden');$('#sidebar').classList.remove('open')}
function load(id){currentId=id;const c=active();$('#chat').innerHTML='';$('#welcome').classList.add('hidden');$('#suggestions').classList.add('hidden');$('#chat').classList.remove('hidden');c.messages.forEach(m=>draw(m.role,m.content));$('#sidebar').classList.remove('open');scrollToBottom()}
function draw(role,content){const row=document.createElement('div');row.className='msg '+(role==='user'?'user':'assistant');if(role!=='user'){const a=document.createElement('div');a.className='avatar';a.textContent='H';row.appendChild(a)}const b=document.createElement('div');b.className='bubble';b.textContent=content;row.appendChild(b);$('#chat').appendChild(row)}
function scrollToBottom(){window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
async function send(text){const q=(text??$('#prompt').value).trim();if(!q||busy)return;$('#error').classList.add('hidden');if(!currentId){currentId=String(Date.now());chats.push({id:currentId,title:q.slice(0,42),messages:[]})}const c=active();c.messages.push({role:'user',content:q});$('#welcome').classList.add('hidden');$('#suggestions').classList.add('hidden');$('#chat').classList.remove('hidden');draw('user',q);$('#prompt').value='';$('#prompt').style.height='auto';persist();busy=true;$('#send').disabled=true;const loading=document.createElement('div');loading.className='msg assistant';loading.id='loading';loading.innerHTML='<div class="avatar">H</div><div class="bubble">Thinking…</div>';$('#chat').appendChild(loading);scrollToBottom();
try{const history=c.messages.slice(-16).map(m=>({role:m.role,content:m.content}));const r=await fetch('api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});let data;try{data=await r.json()}catch(_){throw new Error('Server did not return JSON. Open the site through PHP hosting, not file://.')}if(!r.ok)throw new Error(data.error||'Request failed. Check Gemini API key and hosting.');$('#loading')?.remove();c.messages.push({role:'assistant',content:data.reply});draw('assistant',data.reply);persist()}catch(e){$('#loading')?.remove();$('#error').textContent='Error: '+e.message;$('#error').classList.remove('hidden')}finally{busy=false;$('#send').disabled=false;scrollToBottom()}}
$('#send').onclick=()=>send();$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#prompt').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,180)+'px'});$('#new').onclick=fresh;$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$('#clear').onclick=()=>{if(confirm('Delete saved chat history from this browser?')){chats=[];persist();fresh()}};$('#clearInput').onclick=()=>$('#prompt').focus();$('#suggestions').onclick=e=>{const b=e.target.closest('[data-q]');if(b)send(b.dataset.q)};
function upgrade(){alert('Upgrade and payments are not enabled yet. This button is a placeholder.')}$('#upgrade').onclick=upgrade;$('#upgradeTop').onclick=e=>{e.preventDefault();upgrade()};renderHistory();
</script></body></html>
